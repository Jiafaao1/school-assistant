function saveCourses(){
  if(!csDraft || !csDraft.length) return;
  settleDraft();

  // 作息表存下来，以后单独再导课程表也能直接对上时间
  if(csPeriods && Object.keys(csPeriods).length){
    const keep = {};
    (db.periods || []).forEach(p => { if(p && p.n > 0) keep[p.n] = p; });
    Object.keys(csPeriods).forEach(k => {
      const n = +k, v = csPeriods[k] || {}, cur = keep[n] || {};
      keep[n] = { n: n, start: v.start || cur.start || "", end: v.end || cur.end || "" };
    });
    db.periods = Object.keys(keep).map(k => keep[k]).sort((a, b) => a.n - b.n);
  }

  let added = 0, dup = 0;
  csDraft.forEach(c => {
    const same = db.courses.some(x =>
      x.title === c.title && x.weekday === c.weekday &&
      (x.start || "") === (c.start || "") && (x.room || "") === (c.room || ""));
    if(same){ dup++; return; }
    db.courses.push({
      id: uid(), title: c.title, weekday: c.weekday, date: c.date || null,
      start: c.start || "", end: c.end || "", room: c.room || "", note: c.note || "",
      pf: c.pf || 0, pt: c.pt || 0
    });
    added++;
  });

  csDraft = null; csPeriods = {}; csShots = 0; csProg = "";
  save(); closeSheet(); renderNote();
  toast(added ? `已存 ${added} 节课${dup ? `，跳过 ${dup} 节重复` : ""}` : "这些课已经在课表里了");
}

/* 多张图一起认：课程表和作息表可以分开拍，最后在本地合并 */
async function importCourseImages(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ""));
  if(!list.length){ toast("只支持图片文件"); return; }

  const imgs = [];
  for(const f of list){
    try{ imgs.push(await compressImage(f, 1400, 0.85)); }catch(e){}
  }
  if(!imgs.length){ toast("这些图都打不开，换几张试试？"); return; }

  // 「再加一张」时是追加，不要清掉已经认出来的
  if(!csDraft){ csDraft = null; csPeriods = {}; csShots = 0; }
  const begin = csShots;
  csBusy = true; csProg = ""; openCourseSheet();

  const errs = [];
  for(let i = 0; i < imgs.length; i++){
    csProg = `正在认第 ${begin + i + 1} 张（共 ${begin + imgs.length} 张）`;
    renderCourseSheet();
    try{
      const r = await qwenRecognizeCourse(imgs[i]);
      csShots++;
      if(r.courses && r.courses.length) csDraft = (csDraft || []).concat(r.courses);
      if(r.periods && r.periods.length) mergePeriods(csPeriods, r.periods);
      if(!r.courses.length && !r.periods.length)
        errs.push(`第 ${begin + i + 1} 张没认出课程或作息表`);
    }catch(err){
      errs.push((err && err.message) || `第 ${begin + i + 1} 张没认出来`);
    }
  }

  csBusy = false; csProg = "";
  renderCourseSheet();

  if(!csDraft || !csDraft.length){
    closeSheet();
    toast(errs[0] || "没认出课程，换张更清楚的截图试试");
    return;
  }
  if(errs.length) toast(errs[0]);
}

/* ================= 时间核对 =================
   把「通知正文」和「表单界面」上的时间当成两条独立来源，只做
   提取 → 标注 → 判定，不替用户选哪个为准，也不合并、不改写时间。

   判定规则（写死在这里，方便复核）：
   1) 缺来源 A 或 B       → 信息不全，不做判定
   2) 日期不同            → 存在时间冲突
   3) 日期相同、时段不同  → 截止早于活动开始 / 晚于活动结束：设计上的错开，无冲突
                            截止落在活动进行中：时段逻辑矛盾，存在时间冲突
   4) 日期与时刻都相同    → 无冲突
================================================== */
let tvSources = [];   // { id, kind:"A"|"B"|"?", label, raw, date, start, end }
let tvBusy = false;
let tvProg = "";
let tvShots = 0;

function ymdOf(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function hmOf(ts){
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function normDate(v){
  const m = String(v || "").trim().match(/^(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})$/);
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : "";
}
function normHM(v){
  const m = String(v || "").trim().match(/^(\d{1,2})\s*[:：]\s*(\d{2})$/);
  if(!m) return "";
  const h = +m[1], mi = +m[2];
  return (h > 23 || mi > 59) ? "" : pad(h) + ":" + pad(mi);
}
function minOf(t){
  const m = String(t || "").match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
/* 从原文里取时段的后半段，例如 14:00-17:00 的 17:00 */
function endFromRaw(raw){
  const s = String(raw || "");
  const m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*[-–—~～至到]+\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
  if(!m) return "";
  // "下午 2:00-5:00" 里的 5:00 其实是 17:00，按前面的时段词补 12 小时
  let eh = +m[3];
  if(/(下午|晚上|傍晚)/.test(s) && eh < 12) eh += 12;
  if(/凌晨/.test(s) && eh === 12) eh = 0;
  return pad(eh) + ":" + m[4];
}
/* 从原文兜底取日期：只补「今年」，不往后一年滚。
   核对场景里宁可年份存疑（后面会被年份不一致的提示兜住），也不要替用户推测。 */
function dateFromRaw(raw){
  const s = String(raw || "");
  const y = new Date().getFullYear();
  let m = s.match(/(\d{4})\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})/);
  if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if(m) return `${y}-${pad(+m[1])}-${pad(+m[2])}`;
  m = s.match(/(\d{1,2})\s*[\/]\s*(\d{1,2})/);
  if(m && +m[1] <= 12 && +m[2] <= 31) return `${y}-${pad(+m[1])}-${pad(+m[2])}`;
  return "";
}
function fmtDateCn(d){
  const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${+m[2]}月${+m[3]}日` : (d || "日期不明");
}

function timePrompt(){
  const t = new Date();
  const wl = ["日","一","二","三","四","五","六"];
  const today = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
  return `你是通知时间核对助手。今天是 ${today}（周${wl[t.getDay()]}）。

这张图可能是「活动通知正文」，也可能是「报名 / 提交表单的界面」。请把图中出现的每一个时间原样抽出来，并标明它出现在哪里。只输出严格 JSON 对象，不要解释、不要 markdown 代码块。

输出结构：
{"sources":[{"kind":"A","label":"活动时间","raw":"原文时间片段","date":"2026-10-20","start":"14:00","end":"17:00"}]}

字段说明：
- kind：A = 时间出现在通知正文里；B = 时间出现在表单界面里（表单卡片、"截止"标签、"最近截止"等 UI 文案）；判断不了填 "?"
- label：这条时间是什么，尽量用原文的说法，例如"活动时间""报名时间""截止时间"
- raw：原样抄写图中的那段时间文字。一个字都不许改：不要补年份、不要统一格式、不要改错别字、不要把"下午两点"改成"14:00"
- date：把 raw 里的日期规范成 YYYY-MM-DD，只用于比对；raw 里没有明确日期就填空字符串
- start / end：把时刻规范成 HH:MM，只用于比对；没有时刻就填空；只有一个时刻就只填 start

规则：
1. raw 必须逐字照抄，宁可留空也不许推测、不许补全、不许修正。
2. 同一张图里既有通知又有表单时，按每条时间实际出现的位置分别标 A / B。
3. 只抽时间，"截止""星期一"这类词本身不算一条时间。
4. 最多 10 条。
5. 图中没有任何时间时，sources 输出 []。

只输出 JSON 对象。`;
}

function parseTimeJSON(text){
  let s = String(text || "").trim()
    .replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
  const tryParse = str => { try{ return JSON.parse(str); }catch(e){ return undefined; } };

  const arrTry = () => {
    const a = s.indexOf("["), b = s.lastIndexOf("]");
    if(a < 0 || b <= a) return null;
    const v = tryParse(s.slice(a, b + 1));
    return Array.isArray(v) ? v : null;
  };
  const objTry = () => {
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if(a < 0 || b <= a) return null;
    const v = tryParse(s.slice(a, b + 1));
    if(!v || typeof v !== "object" || Array.isArray(v)) return null;
    return Array.isArray(v.sources) ? v.sources : null;
  };

  const ai = s.indexOf("["), oi = s.indexOf("{");
  const order = (ai >= 0 && (oi < 0 || ai < oi)) ? [arrTry, objTry] : [objTry, arrTry];
  let arr = null;
  for(const fn of order){ const v = fn(); if(v){ arr = v; break; } }
  if(!arr) throw new Error("这张图没读出时间，换一张更清楚的试试。");

  return arr.slice(0, 10).map(it => {
    it = it || {};
    const raw = String(it.raw || "").trim();
    let kind = String(it.kind || "").trim().toUpperCase();
    if(kind !== "A" && kind !== "B") kind = "?";

    let date = normDate(it.date);
    let start = normHM(it.start);
    let end = normHM(it.end);

    // 模型没给规范值时，用原文自己兜一层（原文仍然是唯一的展示依据）
    if(raw){
      if(!date) date = dateFromRaw(raw);
      if(!start){
        const p = parseText(raw);
        if(p.hasTime && p.due) start = hmOf(p.due);
      }
      if(!end) end = endFromRaw(raw);
    }

    return {
      id: uid(), kind: kind,
      label: String(it.label || "").trim(),
      raw: raw, date: date, start: start, end: end
    };
  }).filter(s => s.raw || s.date || s.start);
}

async function qwenRecognizeTime(dataUrl){
  const body = {
    model: QWEN.model,
    messages: [{
      role: "user",
      content: [
        { type: "image_url", image_url: { url: dataUrl } },
        { type: "text", text: timePrompt() }
      ]
    }],
    max_tokens: 1000,
    temperature: 0
  };
  return parseTimeJSON(await qwenVision(body));
}

/* 单对比较：A = 活动时间，B = 表单截止 */
function comparePair(a, b){
  if(!a || !b)
    return { state:"unknown", note:"缺少来源A或来源B，无法比对。请把通知正文和表单界面都补齐。" };
  if(!a.date || !b.date)
    return { state:"unknown", note:"至少有一边没读到明确日期，无法判定，请人工核对原文。" };

  const ay = a.date.slice(0,4), by = b.date.slice(0,4);
  const amd = a.date.slice(5), bmd = b.date.slice(5);

  if(a.date !== b.date){
    if(amd === bmd && ay !== by){
      return { state:"ok", note:`两边的月日一致（${fmtDateCn(a.date)} / ${fmtDateCn(b.date)}），只有年份不同，可能是其中一张没写年份、按今年推算出来的。暂按同一天处理，年份请人工确认。` };
    }
    return { state:"bad", note:`日期不一致：来源A 是 ${fmtDateCn(a.date)}，来源B 是 ${fmtDateCn(b.date)}。两个不同的日期，属于时间信息冲突。` };
  }

  const as = minOf(a.start), ae = minOf(a.end), bs = minOf(b.start);
  const day = fmtDateCn(a.date);

  if(as === null || bs === null)
    return { state:"ok", note:`两条时间在同一天（${day}），至少有一边没写具体时刻，按同日处理，没有冲突。具体时段请人工核对。` };

  const spanTxt = `${a.start}${a.end ? "-" + a.end : ""}`;
  const nightStagger = (bs >= 20*60 && ae !== null && ae <= 18*60)
    ? "活动在白天举办，表单截止是当天夜间，属于设计上的错开，不是错误。" : "";

  if(bs < as)
    return { state:"ok", note:`两条时间在同一天（${day}）。表单截止 ${b.start} 早于活动 ${spanTxt} 开始，属于先截止后举办，没有冲突。` };

  if(bs === as)
    return { state:"ok", note:`两条时间在同一天同一时刻（${day} ${a.start}）。时间点重合，没有冲突，但请确认是不是同一个时间被写在了两个地方。` };

  if(ae !== null && bs <= ae)
    return { state:"bad", note:`同一天（${day}），但表单截止 ${b.start} 落在活动进行中（${a.start}-${a.end}），时段逻辑矛盾，属于时间信息冲突。` };

  return { state:"ok", note:`两条时间在同一天（${day}）。表单截止 ${b.start} 晚于活动 ${spanTxt}，${nightStagger || "属于设计上的错开，不是错误。"}` };
}

/* 多条来源时两两比对，只要有一对冲突就算冲突 */
function tvVerdict(){
  const A = tvSources.filter(s => s.kind === "A");
  const B = tvSources.filter(s => s.kind === "B");
  const U = tvSources.filter(s => s.kind !== "A" && s.kind !== "B");

  if(!A.length && !B.length) return { state:"unknown", A, B, U, note:"还没读到任何时间。" };
  if(!A.length) return { state:"unknown", A, B, U, note:"还没读到来源A（通知正文）里的时间，请补一张通知正文的图。" };
  if(!B.length) return { state:"unknown", A, B, U, note:"还没读到来源B（表单界面）里的时间，请补一张表单界面的图。" };

  let bad = null, first = null;
  A.forEach(a => B.forEach(b => {
    const r = comparePair(a, b);
    if(!first) first = r;
    if(r.state === "bad" && !bad) bad = r;
  }));

  const pick = bad || first;
  return {
    state: bad ? "bad" : (pick.state === "unknown" ? "unknown" : "ok"),
    note: pick.note,
    A, B, U,
    pairs: A.length * B.length
  };
}

function tvRowHTML(s){
  const fixed = s.kind === "A" ? "活动时间" : s.kind === "B" ? "表单截止时间" : "时间";
  const hint = (s.label && s.label !== fixed) ? `图中写作「${s.label}」· ` : "";
  const norm = [s.date, [s.start, s.end].filter(Boolean).join("-")].filter(Boolean).join(" ");
  return `<div class="tv-row">
    <span class="tv-k">${s.kind}</span>
    <div class="tv-c">
      <b>${fixed}：${escapeHTML(s.raw || "（没读到原文）")}</b>
      <span>${escapeHTML(hint)}规范化：${escapeHTML(norm || "不足")} · 仅用于比对</span>
    </div>
    <button class="cs-del" data-tvdel="${s.id}" aria-label="删除">×</button>
  </div>`;
}

function openTimeSheet(){
  $("#mask").classList.add("on");
  $("#tSheet").classList.add("on");
  renderTimeSheet();

function renderTimeSheet(){
  const body = $("#tvBody"), foot = $("#tvFoot");

  if(tvBusy && !tvSources.length){
    $("#tTitle").textContent = "时间核对";
    $("#tDesc").textContent = tvProg || "先把图里的时间原样读出来，再比对。";
    body.innerHTML = `<div class="cs-loading"><i></i><i></i><i></i></div>`;
    foot.innerHTML = "";
    return;
  }

  if(!tvSources.length){
    $("#tTitle").textContent = "时间核对";
    $("#tDesc").textContent = "通知正文和表单界面的时间分开记，再比一遍对不对。";
    body.innerHTML = `<div class="tv-empty">还没有图片。<br>先给一张活动通知正文，再补一张表单界面，也可以一次选两张。</div>`;
    foot.innerHTML = `<button class="btn-main" id="tvAdd">选图片</button>`;
    return;
  }

  const v = tvVerdict();
  const cls = v.state === "bad" ? "bad" : v.state === "ok" ? "ok" : "warn";
  const resultText = v.state === "bad" ? "存在时间冲突" : v.state === "ok" ? "无冲突" : "信息不全，暂不判定";

  $("#tTitle").textContent = "时间核对";
  $("#tDesc").textContent = tvBusy
    ? (tvProg || "正在读…")
    : `共 ${tvSources.length} 条时间来源${tvShots > 1 ? `，来自 ${tvShots} 张图` : ""}。原文照抄，不做修正。`;

  let html = "";
  html += `<div class="tv-sec">
    <div class="tv-h">【来源A｜通知正文原文】<em>${v.A.length} 条</em></div>
    ${v.A.length ? v.A.map(tvRowHTML).join("") : `<div class="tv-none">还没读到通知正文里的时间</div>`}
  </div>`;
  html += `<div class="tv-sec">
    <div class="tv-h">【来源B｜表单界面标注】<em>${v.B.length} 条</em></div>
    ${v.B.length ? v.B.map(tvRowHTML).join("") : `<div class="tv-none">还没读到表单界面上的时间</div>`}
  </div>`;
  if(v.U.length){
    html += `<div class="tv-sec">
      <div class="tv-h">【来源不明】<em>${v.U.length} 条</em></div>
      ${v.U.map(tvRowHTML).join("")}
    </div>`;
  }

  html += `<div class="tv-verdict ${cls}">
    <div class="tv-vt">【冲突判定结果】：${resultText}</div>
    <p>【说明】${escapeHTML(v.note)}</p>
    ${v.pairs > 1 ? `<p style="margin-top:5px;opacity:.55">共 ${v.A.length} 条来源A、${v.B.length} 条来源B，已逐对比对。</p>` : ""}
    <p class="tv-tip">只做提取、标注和判定，不替你选哪个为准。以通知正文为准还是以表单为准，请人工确认后再操作。</p>
  </div>`;

  body.innerHTML = html;
  foot.innerHTML = tvBusy
    ? `<div class="tv-prog"><i></i>${escapeHTML(tvProg || "正在读…")}</div>`
    : `<div class="cs-ops">
        <button class="ghost" id="tvClear">清空</button>
        <button class="ok" id="tvAdd">补充图片</button>
      </div>`;
}

async function importTimeImages(files){
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type || ""));
  if(!list.length){ toast("只支持图片文件"); return; }

  const imgs = [];
  for(const f of list){
    try{ imgs.push(await compressImage(f, 1500, 0.85)); }catch(e){}
  }
  if(!imgs.length){ toast("这些图都打不开，换几张试试？"); return; }

  const begin = tvShots;
  tvBusy = true; tvProg = ""; openTimeSheet();

  const errs = [];
  for(let i = 0; i < imgs.length; i++){
    tvProg = `正在读第 ${begin + i + 1} 张（共 ${begin + imgs.length} 张）`;
    renderTimeSheet();
    try{
      const r = await qwenRecognizeTime(imgs[i]);
      tvShots++;
      if(r.length) tvSources = tvSources.concat(r);
      else errs.push(`第 ${begin + i + 1} 张没读到时间`);
    }catch(err){
      errs.push((err && err.message) || `第 ${begin + i + 1} 张没读出来`);
    }
  }

  tvBusy = false; tvProg = "";
  renderTimeSheet();

  if(!tvSources.length){
    closeSheet();
    toast(errs[0] || "没读到时间，换张清楚的试试");
    return;
  }
  if(errs.length) toast(errs[0]);
}

const GLYPHS = ["助","柚","星","喵","豆","光"];
function paintAvatars(){
  const g = $("#avaGrid");
  const au = draft.theme === "aurora";
  let html = GLYPHS.map((gl,i)=>{
    const c = AVA_COLORS[i % AVA_COLORS.length];
    const bg = au ? "linear-gradient(140deg,#a78bfa,#22d3ee)" : c[0];
    const fg = au ? "#070d20" : c[1];
    const on = draft.avatar.type === "glyph" && draft.avatar.glyph === gl ? " on" : "";
    return `<button class="ava-opt${on}" data-glyph="${gl}" style="background:${bg};color:${fg}">${gl}</button>`;
  }).join("");
  const upOn = draft.avatar.type === "img" ? " on" : "";
  html += `<button class="ava-opt${upOn}" id="upBtn" style="background:rgba(140,140,150,.16);color:currentColor;font-size:16px">＋</button>`;
  g.innerHTML = html;

  g.querySelectorAll("[data-glyph]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const gl = b.dataset.glyph;
      draft.avatar = { type:"glyph", glyph:gl, color:GLYPHS.indexOf(gl), img:null };
      paintAvatars();
    });
  });
  const up = $("#upBtn");
  if(up) up.addEventListener("click", ()=> $("#fileInput").click());
  previewAvatar();
}
function previewAvatar(){
  const av = draft.avatar;
  let html, bg;
  if(av.type === "img" && av.img){
    html = `<img src="${av.img}" alt="">`; bg = "transparent";
  }else if(draft.theme === "aurora"){
    html = `<span>${escapeHTML(av.glyph||"助")}</span>`; bg = "";
  }else{
    const c = AVA_COLORS[(av.color||0) % AVA_COLORS.length];
    html = `<span style="color:${c[1]}">${escapeHTML(av.glyph||"助")}</span>`; bg = c[0];
  }
  document.querySelectorAll(".js-ava").forEach(el=>{
    el.innerHTML = html;
    el.style.background = bg;
  });
}

  if(!el) return;
  el.addEventListener("change", e=>{
    // 先把 FileList 拷成数组：清空 value 会连带把 files 清掉
    const fs = Array.from(e.target.files || []);
    e.target.value = "";
    if(fs.length) handleImage(fs, pickMode);
  });
});

// 识别结果：确认 / 丢弃
document.addEventListener("click", e=>{
  const ok = e.target.closest("[data-confirm]");
  if(ok){ e.stopPropagation(); confirmItems(ok.dataset.confirm); return; }
  const no = e.target.closest("[data-discard]");
  if(no){ e.stopPropagation(); discardItems(no.dataset.discard); return; }
});

// 拖拽图片到对话区（桌面）
["#chatPaneBody","#view-chat"].forEach(sel=>{
  const box = $(sel);
  if(!box) return;
  box.addEventListener("dragover", e=>{ e.preventDefault(); box.style.outline = "2px dashed rgba(128,128,140,.5)"; });
  box.addEventListener("dragleave", ()=>{ box.style.outline = ""; });
  box.addEventListener("drop", e=>{
    e.preventDefault(); box.style.outline = "";
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleImage(f);
  });
});

document.querySelectorAll("[data-quick]").forEach(c=>{
  c.addEventListener("click", ()=>{ send(c.dataset.quick); });
});

// 记事本里「全部课表」（卡片是重渲染的，用委托）
document.addEventListener("click", e=>{
  if(!e.target.closest("#allCourseBtn")) return;
  e.preventDefault();
  openCourseSheet();
});

// 列表点击 -> 编辑（事件委托）
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){
    e.stopPropagation();
    const r = db.records.find(x => x.id === t.dataset.toggle);
    if(r){ r.done = !r.done; r.doneAt = r.done ? Date.now() : 0; save(); renderHome(); renderNote(); }
    return;
  }
  const o = e.target.closest("[data-open]");
  if(o && !document.querySelector(".sheet.on")){
    // 首页卡片点击也允许进入记事本查看
    openRecord(o.dataset.open);
  }
});

// 粘贴图片
document.addEventListener("paste", e=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type && it.type.indexOf("image") === 0){
      const f = it.getAsFile();
      if(!f) continue;
      e.preventDefault();
      handleImage(f);
      return;
    }
  }
});

/* ================= 启动 ================= */
function seed(){
  if(db.seeded || db.records.length) return;
  const now = new Date();
  const mk = (d,h,m)=>{ const x = new Date(now); x.setHours(h,m,0,0); x.setDate(x.getDate()+d); return x.getTime(); };
  db.records = [
    { id:uid(), title:"数学建模国赛 · 报名", due:mk(3,23,59), kind:"竞赛", note:"三人一队，找队友", done:false, createdAt:Date.now()-DAY*2 },
    { id:uid(), title:"数据结构实验报告", due:mk(1,20,0), kind:"作业", note:"第 5 章，附源码", done:false, createdAt:Date.now()-DAY*3 },
    { id:uid(), title:"四级准考证打印", due:mk(8,12,0), kind:"考试", note:"", done:false, createdAt:Date.now()-DAY },
    { id:uid(), title:"社团招新材料", due:mk(6,22,0), kind:"活动", note:"交到活动中心 302", done:false, createdAt:Date.now()-DAY }
  ];
  db.seeded = true;
  db.chats = [{ role:"a", text:`我是${db.profile.name}。作业、竞赛、考试，凡是带截止时间的，截图或文字丢给我就行。\n需要的时候问我一句「最近有什么要交的」，我会把最急的挑出来。`, t:Date.now() }];
  save();
}
/* 版本戳：判断浏览器加载的是不是最新版 */
const APP_VER = "v0.7.1 · 2026-11-27";
(function(){
  const el = $("#verLine");
  if(el) el.textContent = APP_VER + " · 对话 " + QWEN_TEXT.primary;
})();

seed();
renderAll();
autoGrow();

// 跨越断点时校正视图
if(desktopMQ.addEventListener){
  desktopMQ.addEventListener("change", ()=>{
    if(isDesktop() && curView === "chat") go("home");
    autoGrow();
  });
}

// 演示用参数：#theme=aurora&view=chat（不写入本地设置）
try{
  const q = new URLSearchParams(location.hash.replace(/^#/,""));
  const th = q.get("theme");
  if(th === "candy" || th === "aurora"){ db.profile.theme = th; renderAll(); }
  const vw = q.get("view");
  if(vw === "chat" || vw === "note" || vw === "home") go(vw);
  if(q.get("sheet") === "1") openSheet();
  if(q.get("edit") === "1" && db.records[0]) openRecord(db.records[0].id);
}catch(e){}

})();
</script>
